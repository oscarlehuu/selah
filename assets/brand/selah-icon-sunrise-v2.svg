      <stop offset="62%"  stop-color="#FFE8B8" stop-opacity=".14"/>
      <stop offset="100%" stop-color="#FFE8B8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="hotspot" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#FFFBEE" stop-opacity=".95"/>
      <stop offset="55%"  stop-color="#FFF0CC" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#FFF0CC" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mirror" cx="50%" cy="0%" r="94%">
      <stop offset="0%"   stop-color="#FFF3D8" stop-opacity=".92"/>
      <stop offset="26%"  stop-color="#FFE9BE" stop-opacity=".52"/>
      <stop offset="62%"  stop-color="#FFE4B2" stop-opacity=".20"/>
